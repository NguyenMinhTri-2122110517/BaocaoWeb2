spring.application.name=example05
#db config for deployment on server
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:example05}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

#ORM s/w specific properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.jpa.open-in-view=false

#debug logs
logging.level.org.springframework.security=DEBUG
logging.level.com.nguyenminhtri.example05=DEBUG
logging.level.org.springframework.security.oauth2=TRACE

#image
project.image=images/
#spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#JWT Security Key
jwt.secret= 123 #"thay đổi tuỳ ý"

#Swagger OpenAPI
#For sorting endpoints alphabetically
springdoc.swagger-ui.operationsSorter=alpha

#For sorting tags alphabetically
springdoc.swagger-ui.tagsSorter=alpha

#to remove doc expansion
springdoc.swagger-ui.doc-expansion=false

# Swagger UI URL configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Thêm tài khoản admin mặc định nếu cần
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN
spring.security.oauth2.client.registration.google.client-id=
spring.security.oauth2.client.registration.google.client-secret=
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# Cấu hình session để dễ debug
spring.session.store-type=none
server.servlet.session.tracking-modes=cookie

# Server Configuration
server.port=8080

# OpenAI Configuration
#openai.api.key=

# Together AI Configuration
together.api.key=
together.model.id=mistralai/Mistral-7B-Instruct-v0.1

# Spring Configuration
spring.main.allow-bean-definition-overriding=true
